[package]
name = "overfilm-asr"
description = "OverFilm speech recognition: Qwen3-ASR and Qwen3-ForcedAligner in pure Rust (candle), model download, chunking and word-timed transcripts"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# The models themselves (candle on the CPU, wgpu on the GPU). Off in wasm builds.
qwen = ["dep:candle-core", "dep:candle-nn", "dep:wgpu", "dep:pollster", "dep:half"]
# Model downloads over HTTPS (filmcraft-speech's pure-Rust downloader).
download = ["filmcraft-speech/download"]

[dependencies]
filmcraft-speech = { workspace = true }
candle-core = { version = "0.9", default-features = false, optional = true }
candle-nn = { version = "0.9", default-features = false, optional = true }
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan", "dx12", "metal"], optional = true }
pollster = { version = "1", optional = true }
half = { version = "2", optional = true }
fancy-regex = "0.14"
unicode-normalization = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3.27"

[[example]]
name = "qwen_asr"
required-features = ["qwen"]
