# OverShorts 설정 예시. config.yaml 로 복사해서 쓴다. 패널 '설정' 화면에서 바꾸면 config.yaml 에 저장된다.
# 설치본은 처음 켤 때 빠진 항목을 기본값으로 채운다 (원래 파일은 config.yaml.bak).
sources:
  - url: https://gall.dcinside.com/mgallery/board/lists/?id=example
    recommend_only: true
    min_upvotes: 30
    max_posts: 10
    within_hours: 24
filter:
  block_words: []
  allow_topics: []        # 비우면 전부 허용
  min_chars: 15  # 제목+본문 글자 수 (짧은 뻘글도 받음)
  max_chars: 4000
  blur_faces: true        # 첨부 그림 얼굴 흐림
  drop_nsfw_images: true  # 선정성 그림 빼기
llm:
  filter: ollama          # LLM 필터 (로컬 GPU, 라데온은 Ollama AMD 지원)
  script: claude_code     # 대본·오글 검사 (claude -p, 구독)
  fallback: ollama
  ollama_model: qwen3:8b  # VRAM 6~7GB면 qwen3:4b
  ollama_host: http://127.0.0.1:11434
  claude_model: ""        # 비우면 Claude Code 기본 모델
  on_limit: ask           # ask = 패널이 전환/대기를 물음(CLI는 fallback), fallback = 로컬 LLM으로 넘김, wait = 대기열에 둠
voice:
  narrator: edge:ko-KR-SunHiNeural   # 기본 목소리 (보이스 화면에서 고르면 그쪽이 먼저). 클로닝이 실패하면 이 기성 보이스로
  comment: edge:ko-KR-InJoonNeural
  clone:                    # 목소리 클로닝 (GPT-SoVITS 로컬 서버, 라데온은 CPU 로 느리게)
    server: http://127.0.0.1:9880
    dir: null               # GPT-SoVITS 폴더 (api_v2.py 있는 곳). 적으면 필요할 때 켜고 음성 단계 뒤에 끈다
    python: null            # 비우면 <dir>/runtime/python.exe (통합 패키지) → python
    config: null            # tts_infer.yaml (비우면 GPT-SoVITS 기본)
    speed: 1.0
    align: auto             # auto = stable-ts 깔려 있으면 강제 정렬, 아니면 음절 비율 | syllable
render:
  tone: 담백              # 담백 | 드립 조금 | 정리형
  preset: auto            # auto = 원문 사진·영상 있으면 프레임형, 없으면 썰 카드형 | frame | card
  composition: auto       # auto = AI가 A(제목→본문→댓글)/B(제목→본문) 고름 | A | B
  edit_type: ogal         # 편집 유형(S17): ogal 옵갤형 | issue 이슈형 | info 정보형 | game 게임형 | style/presets/ 의 커스텀 id
  max_comments: null      # 영상 전체 댓글 최대 개수 (답글 포함). 비우면 유형 프리셋 값 (옵갤 27, 이슈 24, 정보 18, 게임 15)
  tts: preset             # preset = 유형 프리셋을 따름(옵갤·이슈·게임 끔, 정보 LLM 판단) | off | auto | on
  caption_max_chars: null # 쇼츠 자막 한 줄 최대 글자 (OverFilm 편집기 자막 25자와 별개). 비우면 유형 값 (13~16)
  caption_max_words: null # 한 번에 보이는 최대 어절. 비우면 유형 값
  max_media: 6            # 한 영상에 넣을 원문 미디어 최대 개수
  nickname: original      # original = 원본 그대로 | blur = 흐림 | replace = ㅇㅇ 치환
  bgm_dir: null           # 무음이 5초 넘지 않게 깔 BGM (라이선스 있는 것만)
  background_dir: ./assets/bg   # 직접 녹화했거나 라이선스 있는 배경 영상만
  show_source: true       # 영상 아래 '출처: DC인사이드 …' 표시
  out_dir: ./data/approved
  browser_executable: null      # 비우면 Remotion 이 받은 Chrome
  concurrency: auto       # 렌더 동시 탭 수: auto = 메모리 16GB 이상이면 늘림(최대 8), 아니면 CPU 스레드 절반 | 1~16
                          # 늘리면 빨라지지만 탭마다 메모리를 더 씀. 화질은 같음
script:
  lint: false             # 대본 린터(S3): 읽기 전에 개인정보·금지 표현·길이를 검사해 걸리면 그 작업을 멈춤. 내용은 고치지 않음
  ab: false               # A안·B안 두 버전 대본(S5). 켜면 Claude 호출 2배. 패널/CLI 에서 글마다 따로 켤 수도 있음 (--ab)
  publish: on             # 설명·해시태그 파일(publish.json·txt, S12). 제목에는 해시태그를 넣지 않음. off 면 안 만듦
  soften: false           # 순화: 켜면 욕설·혐오 표현을 나레이션·댓글 고르기에서 피함. 꺼짐 = 원문 그대로 (기본)
verify:
  enabled: false          # 전사 대조(S4): 만든 음성을 STT 로 다시 받아 대본과 비교 (누락·반복·오발음 경고)
  stt_command: null       # 비우면 overfilm-subs extract. {wav}=음성 파일, {srt}=결과 SRT 경로
overfilm:
  editor: null            # OverFilm.exe 경로. 비우면 설치본(%LOCALAPPDATA%\Programs\OverFilm)·PATH 에서 찾음
  open: true              # 넘기면 편집기를 바로 띄움 (false = .overshorts 파일만 만듦)
style:
  dir: ../style
  speech: 반말            # 반말 | 해요체 (채널당 하나)
  min_cringe_score: 7
  title_tail: auto        # 제목 꼬리표: none | ㄷㄷ | ㅋㅋㅋ | auto (글 분위기에 맞춰 0~1개)
  tts: auto               # 읽어 주기 기본값: auto = AI 가 장면마다 | on = 본문·댓글 읽음 | off = 자막만
crawler:
  delay_sec: [1.5, 4]     # 요청마다 랜덤 간격 (1초 미만은 차단 위험)
  rest_every: 10          # 글 N개마다
  rest_sec: [20, 40]      # 긴 휴식
  hourly_limit: 60
  daily_limit: 200
  cooldown_min: 60        # 403·429·캡차 뒤 쉬는 시간
  max_comments: 50
  max_images: 6           # 글당 받을 첨부 사진 (영상은 3개, 한 영상에 원문 미디어 최대 6개)
  proxy: null
gpu_tier: auto
encoder: auto             # auto | nvenc | amf | cpu (라데온 지원)
data_dir: ./data
