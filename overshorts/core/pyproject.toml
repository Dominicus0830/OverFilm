[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overshorts"
version = "0.1.0"
description = "DC 갤러리 → 쇼츠 자동화 (OverFilm 모듈)"
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
overshorts = "overshorts.cli:main"

[tool.setuptools.packages.find]
include = ["overshorts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
